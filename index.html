<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking Polityków</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Ranking Polityków</h1>
      <p class="subtitle">Oceń i porównaj polskich polityków</p>
      <a href="#ranking" class="btn-primary">Zobacz ranking</a>
    </div>
  </header>

  <main>
    <section id="ranking" class="section">
      <div class="container">
        <h2>Top politycy</h2>
        <p class="section-desc">Strona w budowie — wkrótce pełny ranking.</p>
        <div class="placeholder-cards">
          <div class="card placeholder">
            <div class="rank">#1</div>
            <div class="card-info">
              <div class="avatar-placeholder"></div>
              <div class="name-placeholder"></div>
            </div>
          </div>
          <div class="card placeholder">
            <div class="rank">#2</div>
            <div class="card-info">
              <div class="avatar-placeholder"></div>
              <div class="name-placeholder"></div>
            </div>
          </div>
          <div class="card placeholder">
            <div class="rank">#3</div>
            <div class="card-info">
              <div class="avatar-placeholder"></div>
              <div class="name-placeholder"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Ranking Polityków</p>
  </footer>
</body>
</html>
